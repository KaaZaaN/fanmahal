name: Fanmahal Daily Midnight Reset Job

on:
  schedule:
    # 00:00 IST corresponds to 18:30 UTC of previous day
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  midnight-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Midnight Reset Endpoint
        run: |
          echo "Triggering Fanmahal Daily Midnight Reset Endpoint..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.APP_URL }}/api/jobs/midnight-reset" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_SECRET_KEY }}")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | sed -n 's/.*HTTP_STATUS:\([0-9]*\).*/\1/p')

          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Midnight Reset Failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
