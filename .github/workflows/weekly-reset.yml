name: Fanmahal Weekly Sunday Reset Job

on:
  schedule:
    # 00:00 IST Monday corresponds to 18:30 UTC Sunday (cron format: min hr day-of-month month day-of-week)
    - cron: '30 18 * * 0'
  workflow_dispatch: # Allows manual triggers from GitHub UI

jobs:
  weekly-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Weekly Reset Endpoint
        run: |
          echo "Triggering Fanmahal Weekly Reset Endpoint..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.APP_URL }}/api/jobs/weekly-reset" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_SECRET_KEY }}")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | grep -oP 'HTTP_STATUS:\K[0-9]+')

          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Weekly Reset Failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
