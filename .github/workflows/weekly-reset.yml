name: Fanmahal Weekly Sunday Reset Job

on:
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:

jobs:
  weekly-reset:
    runs-on: ubuntu-latest
    steps:
      - name: DEBUG - Raw curl output
        run: |
          echo "Target URL: ${{ secrets.APP_URL }}/api/jobs/weekly-reset"
          curl -v -X POST "${{ secrets.APP_URL }}/api/jobs/weekly-reset" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_SECRET_KEY }}"
