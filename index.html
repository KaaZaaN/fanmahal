        <p>
          Fanmahal is a free-to-play reality TV prediction game for Indian audiences. Predict outcomes across shows like Bigg Boss, Roadies, Splitsvilla, and more, earn Crowns, and win real weekly prizes — no real money staked, ever.
        </p>
        <h2>How It Works</h2>
        <ul>
          <li><strong>Free to Play:</strong> No real money is ever required or accepted. Players receive free virtual Fan Coins to participate.</li>
          <li><strong>Predict Drama & Outcomes:</strong> Submit predictions on weekly nominations, evictions, captaincy tasks, secret room twists, and house drama.</li>
          <li><strong>Earn Crowns:</strong> Successful predictions award virtual Crowns based on question difficulty multipliers.</li>
          <li><strong>Weekly Prizes:</strong> Top scorers on the weekly leaderboard win shopping vouchers (₹2,000 / ₹1,500 / ₹1,000) from popular brands like Myntra, Amazon, Flipkart, Blinkit, Swiggy, and District, plus physical brand sponsor hampers.</li>
        </ul>
